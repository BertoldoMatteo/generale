<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codice fiscale</title>
    <script src="Code/code.js"></script>
    <link rel="stylesheet" href="Style/style.css">
</head>
<body>
    <h1>CODICE FISCALE</h1>
    <form>
        <label>COGNOME</label>
        <input type="text" id="cognome" autofocus required><br>
        <label>NOME</label>
        <input type="text" id="nome" required><br>
        <label>SESSO</label>
        <select id="sesso" required>
            <option value="M">M</option>
            <option value="F">F</option>
        </select><br>
        <label>LUOGO DI NASCITA</label>
        <input type="text" id="provincia" required><br>
        <label>PROVINCIA (SIGLA)</label>
        <input type="text" id="prov" maxlength="2" required><br>
        <label>Inserisci codice del tuo comune di nascita</label>
        <input type="text" id="LuogoDiNascita" maxlength="4" required>
        <a link href="Pdf/codicecomune.pdf" target="_blank">se non ricordi il tuo codice</a><br>
        <label> DATA DI NASCITA</label>
        <input type="date" id="DataDiNascita" required><br>
        <input type="button" onclick="Calcola()" value="Calcola il Codice Fiscale">
        <p id="risposta"></p>
    </form>
</body>
</html>
