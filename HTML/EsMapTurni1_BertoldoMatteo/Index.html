<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turni</title>
    <script src="Code/code.js"></script>
    <link rel="stylesheet" href="Style/style.css">
</head>
<body>
    <p>TURNI</p>
    <form>
        <label>Inserire orario turno</label>
        <select>
            <option value="0"></option>
            <option value="7">7:00 / 8:00</option>
            <option value="8">8:00 / 9:00</option>
            <option value="9">9:00 / 10:00</option>
            <option value="10">10:00 / 11:00</option>
            <option value="11">11:00 / 12:00</option>
        </select>
        <label>Inserire numero studente</label>
        <input type="text" placeholder="Es. 1" id="stud" required>
        <label>inserire azione</label>
        <div id="azioni">
            <input type="button" onclick="Stampa()" value="Stampa">
            <input type="button" onclick="ContaTurni()" value="Conta turni">
            <input type="button" onclick="ContaStudenti()" value="Conta studenti">
            <input type="button" onclick="Verifica()" value="verifica presenza">
            <input type="button" onclick="aggiungi()" value="Aggiungi">
            <input type="button" onclick="rimuovi()" value="Rimuovi">
        </div>
    </form>
    <p id="risp"></p>
    <p>Tabella turni inserimento</p>
    <table id="tab">
        <tr>
            <th>TURNO</th>
            <th>STUDENTE</th>
        </tr>
        <tr id="tr7">
            <td>7:00 / 8:00</td>
        </tr>
        <tr id="tr8">
            <td>8:00 / 9:00</td>
        </tr>
        <tr id="tr9">
            <td>9:00 / 10:00</td>
        </tr>
        <tr id="tr10">
            <td>10:00 / 11:00</td>
            
        </tr>
        <tr id="tr11">
            <td>11:00 / 12:00</td>
            
        </tr>
    </table>   
</body>
</html>
